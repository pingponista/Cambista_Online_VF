# ===========================================================================
# DATABASE-PER-SERVICE: ISOLATED POSTGRESQL INSTANCES
# ===========================================================================

# --- AUTH DATABASE ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-auth
  namespace: cambista-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-auth
  template:
    metadata:
      labels:
        app: postgres-auth
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value:  cambista_auth_db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cambista-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cambista-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres, -d, cambista_auth_db]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, postgres, -d, cambista_auth_db]
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-auth-service
  namespace: cambista-system
spec:
  type: ClusterIP
  selector:
    app: postgres-auth
  ports:
    - port: 5432
      targetPort: 5432
---

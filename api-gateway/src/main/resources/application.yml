server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        # Auth Service Routing
        - id: auth-service
          uri: ${SERVICES_AUTH_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**

        # Exchange Rate Calculation Engine Routing
        - id: exchange-rate-service
          uri: ${SERVICES_EXCHANGE_RATE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/rates/**, /api/v1/exchange/**

        # Wallet and Ledger Service Routing
        - id: wallet-ledger-service
          uri: ${SERVICES_WALLET_LEDGER_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/wallets/**, /api/v1/ledger/**, /api/v1/points/**

        # Transaction and Order Orchestration Routing
        - id: transaction-service
          uri: ${SERVICES_TRANSACTION_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/orders/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,prometheus
  endpoint:
    gateway:
      enabled: true
    prometheus:
      enabled: true
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: W3C,B3
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4318/v1/traces}

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO

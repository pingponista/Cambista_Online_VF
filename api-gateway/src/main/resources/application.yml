server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        # Auth Service Routing
        - id: auth-service
          uri: ${SERVICES_AUTH_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**

        # Exchange Rate Calculation Engine Routing
        - id: exchange-rate-service
          uri: ${SERVICES_EXCHANGE_RATE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/rates/**, /api/v1/exchange/**

        # Wallet and Ledger Service Routing
        - id: wallet-ledger-service
          uri: ${SERVICES_WALLET_LEDGER_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/wallets/**, /api/v1/ledger/**, /api/v1/points/**

        # Transaction and Order Orchestration Routing
        - id: transaction-service
          uri: ${SERVICES_TRANSACTION_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/orders/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO

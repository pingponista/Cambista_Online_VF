global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway:8080']
        labels:
          application: 'api-gateway'
          environment: 'production'

  - job_name: 'auth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['auth-service:8081']
        labels:
          application: 'auth-service'
          environment: 'production'

  - job_name: 'exchange-rate-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['exchange-rate-service:8082']
        labels:
          application: 'exchange-rate-service'
          environment: 'production'

  - job_name: 'wallet-ledger-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['wallet-ledger-service:8083']
        labels:
          application: 'wallet-ledger-service'
          environment: 'production'

  - job_name: 'transaction-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['transaction-service:8084']
        labels:
          application: 'transaction-service'
          environment: 'production'
